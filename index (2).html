<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Pliki</title>
  <style>
    body { font-family: Arial; background: #f0f0f0; padding: 20px; }
    #loginBox, #panel {
      max-width: 500px;
      margin: auto;
      background: #fff;
      padding: 20px;
      border-radius: 10px;
    }
    #panel { display: none; }
    input, button { padding: 10px; width: 100%; margin-top: 10px; }
    .file-item { padding: 5px; }
  </style>
</head>
<body>

<div id="loginBox">
  <h2>Logowanie</h2>
  <input id="email" type="email" placeholder="Email">
  <input id="pass" type="password" placeholder="Hasło">
  <button id="loginBtn">Zaloguj</button>
</div>

<div id="panel">
  <h2>Twoje pliki</h2>
  <div id="fileList">Ładowanie…</div>

  <hr>

  <h3>Dodaj nowy plik</h3>
  <input type="file" id="fileInput">
  <button id="uploadBtn">Wyślij</button>

  <hr>

  <button id="logoutBtn">Wyloguj</button>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut }
    from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
  import { getStorage, ref, uploadBytes, listAll, getDownloadURL }
    from "https://www.gstatic.com/firebasejs/12.6.0/firebase-storage.js";

  // ─── TWOJA KONFIGURACJA FIREBASE ───
  const firebaseConfig = {
    apiKey: "API_KEY",
    authDomain: "pliki-4bea1.firebaseapp.com",
    projectId: "pliki-4bea1",
    storageBucket: "pliki-4bea1.firebasestorage.app",
    messagingSenderId: "71539157374",
    appId: "1:71539157374:web:a5b571dac01add5e052b2f",
    measurementId: "G-YG9QZWWPB6"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const storage = getStorage(app);

  const loginBox = document.getElementById("loginBox");
  const panel = document.getElementById("panel");
  const fileList = document.getElementById("fileList");

  // ─── LOGIN ───
  document.getElementById("loginBtn").onclick = () => {
    const email = document.getElementById("email").value;
    const pass = document.getElementById("pass").value;
    signInWithEmailAndPassword(auth, email, pass)
      .catch(() => alert("Błędne dane"));
  };

  // ─── LOGOUT ───
  document.getElementById("logoutBtn").onclick = () => {
    signOut(auth);
  };

  // ─── LISTA PLIKÓW ───
  async function loadFiles() {
    fileList.innerHTML = "Ładowanie…";
    const folderRef = ref(storage, "/");
    const res = await listAll(folderRef);

    if (res.items.length === 0) {
      fileList.innerHTML = "Brak plików.";
      return;
    }

    fileList.innerHTML = "";

    for (const fileRef of res.items) {
      const url = await getDownloadURL(fileRef);
      const div = document.createElement("div");
      div.className = "file-item";
      div.innerHTML = `<a href="${url}" target="_blank">${fileRef.name}</a>`;
      fileList.appendChild(div);
    }
  }

  // ─── UPLOAD ───
  document.getElementById("uploadBtn").onclick = async () => {
    const file = document.getElementById("fileInput").files[0];
    if (!file) return alert("Wybierz plik");

    const fileRef = ref(storage, file.name);
    await uploadBytes(fileRef, file);

    alert("Wysłano!");
    loadFiles();
  };

  // ─── ZMIANA STANU LOGINU ───
  onAuthStateChanged(auth, user => {
    if (user) {
      loginBox.style.display = "none";
      panel.style.display = "block";
      loadFiles();
    } else {
      loginBox.style.display = "block";
      panel.style.display = "none";
    }
  });
</script>

</body>
</html>
